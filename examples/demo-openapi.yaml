openapi: 3.0.3
info:
  title: Demo Posts API
  version: 1.0.0
  description: A safe read-only sample for the public JSONPlaceholder demo API. In TestPilot, use https://jsonplaceholder.typicode.com as the target base URL.
servers:
  - url: https://jsonplaceholder.typicode.com
paths:
  /posts:
    get:
      operationId: listPosts
      summary: List sample posts
      responses:
        '200':
          description: Posts returned
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      type: integer
                    id:
                      type: integer
                    title:
                      type: string
                    body:
                      type: string
  /posts/{post_id}:
    parameters:
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPost
      summary: Get one sample post
      responses:
        '200':
          description: Post returned
        '404':
          description: Post not found
